name: Test ZIP builds standalone

on:
  push:
    paths:
      - 'Muxrec.zip'
      - '.github/workflows/test-zip-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP without modifying source
        run: |
          mkdir source
          unzip -q Muxrec.zip -d source
          echo "Extracted files:"
          find source -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Build debug APK from extracted ZIP
        working-directory: source
        run: |
          SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts in ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Building project in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Muxxrec-standalone-test-APK
          path: source/**/*.apk
          if-no-files-found: error
          retention-days: 14
